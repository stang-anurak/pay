<!doctype html>
<html lang="th">
<head>
  <base target="_top">
  <style>
    :root { font-family: system-ui, sans-serif; color: #172e29; background: #edf4ef; }
    * { box-sizing: border-box; }
    body { margin: 0; padding: clamp(16px, 6vw, 64px) 16px; }
    main { max-width: 480px; margin: auto; background: white; padding: clamp(20px, 5vw, 36px);
      border: 1px solid #d4e2da; border-radius: 20px; box-shadow: 0 12px 36px #12352a12; }
    h1 { margin: 0 0 24px; font-size: 1.8rem; }
    form { display: grid; gap: 16px; }
    label { display: grid; gap: 6px; font-weight: 600; }
    input, select, textarea, button { width: 100%; min-width: 0; font: inherit;
      padding: 12px; border-radius: 10px; }
    input, select, textarea { border: 1px solid #9dafaa; background: #fcfdfc; color: inherit;
      font-weight: 400; }
    textarea { resize: vertical; }
    button { border: 0; background: #155b46; color: white; font-weight: 700; cursor: pointer; }
    button:disabled { opacity: .65; cursor: wait; }
    :focus-visible { outline: 3px solid #318769; outline-offset: 2px; }
    #status { margin: 12px 0 0; min-height: 1.5em; overflow-wrap: anywhere; }
    #status[data-error="true"] { color: #a52c20; }
  </style>
</head>
<body>
  <main>
    <h1>บันทึกรายจ่าย</h1>
    <form id="expense">
      <label>จำนวนเงิน (บาท)
        <input name="amount" type="text" inputmode="decimal" maxlength="12"
          pattern="[0-9]{1,9}([.][0-9]{1,2})?" placeholder="0.00" required>
      </label>
      <label>วันที่จ่าย
        <input name="date" type="date" value="<?= today ?>" required>
      </label>
      <label>หมวดหมู่
        <select name="category" required>
          <option value="">เลือกหมวดหมู่</option>
          <? for (const category of categories) { ?>
            <option value="<?= category ?>"><?= category ?></option>
          <? } ?>
        </select>
      </label>
      <label>รายละเอียด (ไม่บังคับ)
        <textarea name="description" maxlength="300" rows="2"></textarea>
      </label>
      <button type="submit">บันทึกรายจ่าย</button>
    </form>
    <p id="status" role="status"></p>
  </main>
  <script>
    const form = document.querySelector('#expense');
    const status = document.querySelector('#status');
    const button = form.querySelector('button');
    let pending = null;

    function showStatus(message, isError = false) {
      status.textContent = message;
      status.dataset.error = String(isError);
    }

    function setBusy(busy) {
      for (const field of form.elements) field.disabled = busy;
      button.textContent = busy ? 'กำลังบันทึก…' : 'บันทึกรายจ่าย';
    }

    form.addEventListener('submit', event => {
      event.preventDefault();
      if (button.disabled) return;
      const fields = Object.fromEntries(new FormData(form));
      if (Number(fields.amount) <= 0) {
        showStatus('กรุณากรอกจำนวนเงินมากกว่า 0 บาท', true);
        form.elements.amount.focus();
        return;
      }
      const signature = JSON.stringify(fields);
      if (!pending || pending.signature !== signature) {
        pending = { signature, id: crypto.randomUUID() };
      }

      setBusy(true);
      showStatus('');
      google.script.run
        .withSuccessHandler(() => {
          pending = null;
          form.reset();
          form.elements.date.value = fields.date;
          setBusy(false);
          showStatus('บันทึกรายจ่ายแล้ว');
          form.elements.amount.focus();
        })
        .withFailureHandler(error => {
          setBusy(false);
          showStatus(error.message || 'บันทึกไม่สำเร็จ กรุณาลองอีกครั้ง', true);
        })
        .saveExpense({ ...fields, id: pending.id });
    });
  </script>
</body>
</html>
